const songs=CONFIG.spotify.songs;let current=-1,playing=false,pos=0,duration=187,tick=null,audio=new Audio();audio.loop=false;$('#playlistName').textContent=CONFIG.spotify.playlistName;$('#creator').textContent=CONFIG.spotify.creator;$('#songCount').textContent=songs.length;function setCover(el,url){if(url)el.style.backgroundImage=`url("${url}")`;else el.style.backgroundImage=''}setCover($('#spCover'),CONFIG.spotify.cover);$('#tracks').innerHTML=songs.map((s,i)=>`<div class="track" data-track="${i}"><div class="trackinfo"><div class="trackname">${s.title}</div><div class="trackartist">${s.artist}</div></div><button class="trackmore">⋮</button></div>`).join('');function fmt(n){return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}function paintPlayer(){let s=songs[current];$('#miniTitle').textContent=s.title;$('#miniArtist').textContent=s.artist;$('#playerTitle').textContent=s.title;$('#playerArtist').textContent=s.artist;$('#elapsed').textContent=fmt(pos);$('#duration').textContent=fmt(duration);$('#seek').value=duration?pos/duration*100:0;$('#miniProgress').style.width=(pos/duration*100)+'%';$('#miniPlay').textContent=playing?'Ⅱ':'▶';$('#playerPlay').textContent=playing?'Ⅱ':'▶';$$('.track').forEach((e,i)=>{e.classList.toggle('playing',i===current&&playing);let n=e.querySelector('.trackname');n.innerHTML=i===current&&playing?`<span class="equalizer"><i></i><i></i><i></i></span>${songs[i].title}`:songs[i].title});setCover($('#miniCover'),CONFIG.spotify.cover);setCover($('#playerCover'),CONFIG.spotify.cover)}function selectSong(i){current=(i+songs.length)%songs.length;pos=0;duration=187;let s=songs[current];audio.pause();if(s.audio){audio=new Audio(s.audio);audio.onloadedmetadata=()=>{duration=audio.duration;paintPlayer()};audio.onended=nextSong}$('#mini').style.display='flex';playing=true;if(s.audio)audio.play().catch(()=>{});if(tick)clearInterval(tick);tick=setInterval(()=>{if(!playing)return;if(s.audio&&audio.duration)pos=audio.currentTime;else pos++;if(pos>=duration){nextSong();return}paintPlayer()},1000);paintPlayer()}function togglePlay(){if(current<0){selectSong(0);return}if(!$('#mini').style.display||$('#mini').style.display==='none'){selectSong(0);return}playing=!playing;if(songs[current].audio){playing?audio.play().catch(()=>{}):audio.pause()}paintPlayer()}function nextSong(){selectSong((current+1)%songs.length)}$('#tracks').onclick=e=>{let t=e.target.closest('[data-track]');if(t)selectSong(+t.dataset.track)};$('#playlistPlay').onclick=()=>current<0||!$('#mini').style.display||$('#mini').style.display==='none'?selectSong(0):togglePlay();$('#miniPlay').onclick=e=>{e.stopPropagation();togglePlay()};$('#mini').onclick=()=>$('#player').style.display='flex';$('#closePlayer').onclick=()=>$('#player').style.display='none';$('#playerPlay').onclick=togglePlay;$('#nextBtn').onclick=nextSong;$('#prevBtn').onclick=()=>pos>3?(pos=0,paintPlayer()):selectSong((current-1+songs.length)%songs.length);$('#seek').oninput=e=>{pos=duration*e.target.value/100;if(songs[current]&&songs[current].audio)audio.currentTime=pos;paintPlayer()};$('#shuffleBtn').onclick=()=>{if(songs.length>1)selectSong(Math.floor(Math.random()*songs.length))};$('#shufflePlayer').onclick=$('#shuffleBtn').onclick;$('#repeatBtn').onclick=e=>e.currentTarget.style.color='#1db954';
